<!DOCTYPE html><html lang="zh-CN"><head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>古灵阁 · 灯光控制台</title>
  <style>*{box-sizing:border-box;margin:0;padding:0}html,body{background:#0a0c12;width:100%;height:100%;font-family:-apple-system,PingFang SC,Microsoft YaHei,sans-serif;overflow:hidden}#app{width:100%;height:100%}#panel{z-index:10;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:#e8e4da;-webkit-user-select:none;user-select:none;background:#0c0e16c7;border:1px solid #ffc8782e;border-radius:14px;width:264px;padding:16px 18px;position:fixed;top:16px;left:16px}#panel h1{letter-spacing:1px;color:#f0d9a8;margin-bottom:2px;font-size:16px}#panel .sub{color:#8a877e;margin-bottom:14px;font-size:11px}.group{margin-bottom:14px}.group .label{color:#9a958a;letter-spacing:1px;margin-bottom:6px;font-size:11px}.btns{flex-wrap:wrap;gap:6px;display:flex}.btns button{cursor:pointer;color:#d8d4c8;background:#ffffff0f;border:1px solid #ffffff1f;border-radius:8px;flex:auto;padding:7px 10px;font-size:12px;transition:all .15s}.btns button:hover{background:#ffd28c24}.btns button.active{color:#ffd998;background:#ffbe6438;border-color:#ffbe648c}.slider-row{align-items:center;gap:8px;margin-bottom:8px;display:flex}.slider-row .ico{text-align:center;width:20px;font-size:14px}.slider-row input[type=range]{-webkit-appearance:none;background:#ffffff26;border-radius:2px;outline:none;flex:1;height:4px}.slider-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;cursor:pointer;background:#ffcf8a;border:2px solid #3a2f1c;border-radius:50%;width:14px;height:14px}.slider-row .val{color:#b8b2a4;text-align:right;width:30px;font-size:11px}.toggle-row{color:#c8c4b8;cursor:pointer;align-items:center;gap:8px;font-size:12px;display:flex}.toggle-row input{accent-color:#ffbe64}#loading{color:#d8c9a0;letter-spacing:3px;z-index:20;background:#0a0c12;justify-content:center;align-items:center;font-size:14px;transition:opacity .6s;display:flex;position:fixed;inset:0}#panelClose,#panelToggle{display:none}
@media (max-width:760px){
  html,body{overflow:hidden}
  #panel{
    display:none;top:auto;left:12px;right:12px;bottom:12px;width:auto;
    max-height:76vh;overflow:auto;padding:16px 18px 18px;border-radius:16px;
  }
  body.panelOpen #panel{display:block}
  #panelToggle{
    display:block;position:fixed;z-index:12;left:50%;bottom:18px;transform:translateX(-50%);
    border:1px solid #ffc87866;background:rgba(12,14,22,.9);color:#f0d9a8;
    border-radius:18px;padding:10px 16px;font:600 13px/1 -apple-system,PingFang SC,sans-serif;
    box-shadow:0 3px 14px rgba(0,0,0,.35);backdrop-filter:blur(10px);
  }
  body.panelOpen #panelToggle{display:none}
  #panelClose{
    display:block;position:absolute;top:10px;right:10px;z-index:2;
    border:0;background:none;color:#b9ab8d;font:600 14px/1 -apple-system,PingFang SC,sans-serif;
    padding:6px;
  }
}
</style>
  <script type="module" crossorigin="" src="./assets/index--_ZqCh7n.js"></script>
</head>
<body>
  <div id="app"></div>
  <div id="loading">古 灵 阁 加 载 中 …</div>
  <div id="panel">
    <button id="panelClose" type="button" aria-label="关闭灯光控制台">✕</button>
    <h1>古灵阁 · 灯光控制台</h1>
    <div class="sub">Gringotts Lighting Console</div>

    <div class="group">
      <div class="label">灯光氛围</div>
      <div class="btns" id="moodBtns">
        <button data-mood="bright">☀️ 明亮</button>
        <button data-mood="night">🌙 暗夜</button>
        <button data-mood="golden" class="active">🏛️ 金色大厅</button>
      </div>
    </div>

    <div class="group">
      <div class="label">机位</div>
      <div class="btns" id="camBtns">
        <button data-cam="full">全景</button>
        <button data-cam="front">正立面</button>
        <button data-cam="dragon">穹顶火龙</button>
        <button data-cam="vault">地下金库</button>
      </div>
    </div>

    <div class="group">
      <div class="label">细节调节</div>
      <div class="slider-row"><span class="ico">🔥</span>
        <input type="range" id="fire" min="0" max="2" step="0.01" value="1"/><span class="val" id="fireVal">100%</span></div>
      <div class="slider-row"><span class="ico">🏮</span>
        <input type="range" id="lamp" min="0" max="2" step="0.01" value="1"/><span class="val" id="lampVal">100%</span></div>
      <div class="slider-row"><span class="ico">🌫️</span>
        <input type="range" id="fog" min="0" max="1" step="0.01" value="0.35"/><span class="val" id="fogVal">35%</span></div>
      <div class="slider-row"><span class="ico">🕸️</span>
        <input type="range" id="grunge" min="0" max="1" step="0.01" value="0.7"/><span class="val" id="grungeVal">70%</span></div>
    </div>

    <label class="toggle-row"><input type="checkbox" id="spin"/> 自动旋转</label>
  </div>
  <button id="panelToggle" type="button" aria-expanded="false" aria-controls="panel">✦ 灯光控制</button>


<script>
    const panelToggle = document.getElementById('panelToggle');
    const panelClose = document.getElementById('panelClose');
    const panelEl = document.getElementById('panel');
    function setPanelOpen(open){
      document.body.classList.toggle('panelOpen', open);
      panelToggle.setAttribute('aria-expanded', String(open));
      if (open) panelEl.scrollTop = 0;
    }
    panelToggle.addEventListener('click', () => setPanelOpen(!document.body.classList.contains('panelOpen')));
    panelClose.addEventListener('click', () => setPanelOpen(false));
    document.addEventListener('keydown', e => { if (e.key === 'Escape') setPanelOpen(false); });
  </script>

</body></html>
