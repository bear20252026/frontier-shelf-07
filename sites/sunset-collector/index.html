<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>日落收藏家 · Sunset Collector</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #232b3d; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  #clock {
    position: fixed; left: 50%; bottom: 118px; transform: translateX(-50%);
    font-family: Georgia, "Songti SC", "SimSun", serif;
    font-size: 15px; letter-spacing: 0.18em; color: rgba(255, 244, 224, 0.82);
    text-shadow: 0 1px 8px rgba(0,0,0,0.45);
    opacity: 0; transition: opacity 0.5s ease; pointer-events: none;
    user-select: none; white-space: nowrap;
  }
  #clock.show { opacity: 1; }
  #hint {
    position: fixed; left: 50%; bottom: 88px; transform: translateX(-50%);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 12px; letter-spacing: 0.12em; color: rgba(255,255,255,0.5);
    text-shadow: 0 1px 6px rgba(0,0,0,0.5);
    transition: opacity 1.2s ease; pointer-events: none; user-select: none;
  }
  #hint.gone { opacity: 0; }

  /* ---------- 底部日落时间轴 ---------- */
  #timebar {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(12px);
    width: min(560px, 72vw); padding: 10px 18px 8px;
    background: rgba(16, 20, 32, 0.55); backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 220, 170, 0.14); border-radius: 16px;
    opacity: 0; transition: opacity 1.0s ease, transform 1.0s cubic-bezier(0.22, 1, 0.36, 1);
    user-select: none; z-index: 20; pointer-events: none;
  }
  #timebar.ready { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  #tb-row { display: flex; align-items: center; gap: 14px; }
  #tb-clock {
    font-family: Georgia, "Songti SC", serif; font-size: 15px; letter-spacing: 0.1em;
    color: rgba(255, 240, 214, 0.92); min-width: 52px; text-align: center;
    text-shadow: 0 1px 6px rgba(0,0,0,0.5); pointer-events: none;
  }
  #tb-track {
    position: relative; flex: 1; height: 26px; cursor: pointer; touch-action: none;
  }
  #tb-rail {
    position: absolute; left: 0; right: 0; top: 50%; height: 6px; transform: translateY(-50%);
    border-radius: 3px;
    background: linear-gradient(90deg, #f7ddb0 0%, #ffcf7d 22%, #ff7a2e 46%, #c65a45 62%, #4d5b94 80%, #141d3a 100%);
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.45);
  }
  #tb-fill {
    position: absolute; left: 0; top: 50%; height: 6px; transform: translateY(-50%);
    border-radius: 3px; background: rgba(255, 255, 255, 0.34);
    box-shadow: 0 0 6px rgba(255, 230, 180, 0.35); pointer-events: none;
  }
  .tb-tick {
    position: absolute; top: 50%; width: 1px; height: 10px; transform: translate(-0.5px, -50%);
    background: rgba(255, 255, 255, 0.28); pointer-events: none;
  }
  .tb-tick-label {
    position: absolute; top: 15px; transform: translateX(-50%);
    font-family: Georgia, serif; font-size: 9px; letter-spacing: 0.06em;
    color: rgba(255, 235, 205, 0.55); pointer-events: none;
  }
  #tb-thumb {
    position: absolute; top: 50%; width: 15px; height: 15px; border-radius: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle at 38% 35%, #fff6dc, #ffc25e 58%, #ff8a3c);
    box-shadow: 0 0 10px 2px rgba(255, 190, 90, 0.75), 0 1px 4px rgba(0,0,0,0.5);
    pointer-events: none; transition: box-shadow 0.6s ease;
  }
  #timebar.night #tb-thumb {
    background: radial-gradient(circle at 38% 35%, #f4f7ff, #b9c8ee 58%, #7d8fc9);
    box-shadow: 0 0 10px 2px rgba(170, 195, 255, 0.6), 0 1px 4px rgba(0,0,0,0.5);
  }

  /* ---------- 进入动画：夜幕 + 片名 ---------- */
  #veil {
    position: fixed; inset: 0; background: #0d1220; z-index: 60;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 1.4s ease; pointer-events: none;
  }
  #veil.lift { opacity: 0; }
  #veil h1 {
    margin: 0; font-family: Georgia, "Songti SC", "SimSun", serif; font-weight: normal;
    font-size: clamp(30px, 5vw, 52px); letter-spacing: 0.42em; text-indent: 0.42em;
    color: #f5e3c2; text-shadow: 0 0 26px rgba(255, 170, 80, 0.35);
    opacity: 0; animation: veilTitle 1.7s cubic-bezier(0.22, 1, 0.36, 1) 0.35s forwards;
  }
  #veil p {
    margin: 14px 0 0; font-family: Georgia, serif; font-size: 12px;
    letter-spacing: 0.55em; text-indent: 0.55em; color: rgba(245, 227, 194, 0.5);
    opacity: 0; animation: veilTitle 1.7s cubic-bezier(0.22, 1, 0.36, 1) 0.62s forwards;
  }
  @keyframes veilTitle {
    0% { opacity: 0; transform: translateY(12px); filter: blur(7px); }
    100% { opacity: 1; transform: translateY(0); filter: blur(0); }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./node_modules/three/build/three.module.js",
    "three/addons/": "./node_modules/three/examples/jsm/"
  }
}
</script>
  <script type="module" crossorigin="" src="./assets/index-CKsdW8Xb.js"></script>
</head>
<body>
<div id="app"></div>
<div id="clock"></div>
<div id="hint">拖动旋转 · 时间轴拨动日落 · 点击物件聚焦 · 点太阳收藏这一刻</div>
<div id="ver" style="position:fixed;right:8px;bottom:8px;color:rgba(255,255,255,0.45);font:10px monospace;z-index:99;pointer-events:none;">build 2026-09-14 20:55 · shafts-jitter-v2</div>
<div id="timebar">
  <div id="tb-row">
    <div id="tb-clock">18:10</div>
    <div id="tb-track">
      <div id="tb-rail"></div>
      <div id="tb-fill"></div>
      <div id="tb-thumb"></div>
    </div>
  </div>
</div>
<div id="veil">
  <h1>日落收藏家</h1>
  <p>SUNSET COLLECTOR · 17:00 — 20:00</p>
</div>
<div id="err" style="position:fixed;top:4px;left:4px;color:#f66;font:12px monospace;z-index:99;white-space:pre-wrap;max-width:90vw;"></div>
<script>
window.addEventListener('error', e => { document.getElementById('err').textContent += (e.message || e.error) + ' @ ' + (e.filename||'') + ':' + (e.lineno||'') + '\n'; });
window.addEventListener('unhandledrejection', e => { document.getElementById('err').textContent += 'PROMISE: ' + (e.reason && (e.reason.stack || e.reason.message || e.reason)) + '\n'; });
</script>





</body></html>
