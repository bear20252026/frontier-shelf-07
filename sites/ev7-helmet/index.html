<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Moonshot EV-7 舱外活动头盔</title>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="vig"></div>
  <div id="labels"></div>
</div>

<div id="brand" class="chrome">
  <p class="wm">MOONSHOT</p>
  <p class="md">EV-7 舱外活动头盔 <span>／ 工程样机 SN 0042</span></p>
</div>

<nav id="shots" class="chrome">
  <h2>关键视角</h2>
  <button data-shot="0">正视</button>
  <button data-shot="1" class="on">四分之三</button>
  <button data-shot="2">面罩抬起</button>
  <button data-shot="3">头盔内部</button>
  <button data-shot="4">生命维持接口</button>
  <button data-shot="5">部件分解</button>
</nav>

<section id="spec" class="chrome">
  <dl>
    <dt>外壳</dt><dd>芳纶／聚碳酸酯复合，壁厚 5 mm</dd>
    <dt>面罩</dt><dd>3.5 mm 光学聚碳酸酯，透光率 91%</dd>
    <dt>视场</dt><dd>水平 121°，垂直 83°</dd>
    <dt>接口</dt><dd>双路气体快接 ＋ 通信电缆</dd>
    <dt>质量</dt><dd>1.84 kg（含颈环）</dd>
  </dl>
</section>

<div id="dock" class="chrome">
  <div id="ex"><label>分解 <input id="exr" type="range" min="0" max="100" value="0" aria-label="部件分解程度"/><output id="exo">0%</output></label></div>
  <div class="row">
    <button id="bVisor" aria-pressed="false">抬起面罩</button>
    <button id="bView" aria-pressed="false">进入内部</button>
  </div>
  <div class="row">
    <button id="bAnno" aria-pressed="true">隐藏标注</button>
    <button id="bSave" hidden="">保存这一帧</button>
  </div>
</div>

<p id="hint">拖动环视 · 滚轮缩放 · V 面罩 · I 内部 · E 分解</p>

<div id="loader"><p id="lmsg">正在构建头盔几何体</p><div id="bar"><i id="bari"></i></div></div>

<!-- Three.js r128 已本地化，完全离线可用 -->
<script src="vendor/three.min.js"></script>
<script src="js/math.js"></script>
<script src="js/geometry.js"></script>
<script src="js/textures.js"></script>
<script src="js/helmet.js"></script>
<script src="js/app.js"></script>


</body></html>
