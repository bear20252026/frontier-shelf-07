<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>AEOLIS 01 · 火星地表探索概念车</title>
<style>
  :root{
    --ink:#05060a;
    --paper:#e7ebf0;
    --dust:#c8703c;
    --nav:#7fd8ff;
    --line:rgba(231,235,240,.20);
    --line2:rgba(231,235,240,.38);
    --glass:rgba(8,10,14,.46);
    --fs:clamp(11px,1.05vw,13px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--ink);}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--paper);
    font-size:var(--fs);
    -webkit-font-smoothing:antialiased;
  }
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  canvas.drag{cursor:grabbing}
  #stage{position:fixed;inset:0}

  /* ── 遮幅 ── */
  .lb{position:fixed;left:0;right:0;height:0;background:#000;z-index:40;pointer-events:none;will-change:height}
  #lbT{top:0}#lbB{bottom:0}

  /* ── 字标 ── */
  #brand{position:fixed;left:26px;top:24px;z-index:30;pointer-events:none;opacity:0;transition:opacity .8s ease}
  #brand .w{
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    font-weight:200;font-size:19px;letter-spacing:.44em;line-height:1;
    text-indent:.44em;
  }
  #brand .w b{font-weight:600}
  #brand .s{margin-top:9px;font-size:11px;letter-spacing:.30em;color:rgba(231,235,240,.42)}

  /* ── 片头字幕 ── */
  #titles{position:fixed;inset:0;z-index:35;display:grid;place-items:center;pointer-events:none}
  #titles .t{grid-area:1/1;text-align:center;opacity:0;transform:translateY(10px);transition:opacity .9s ease,transform 1.4s cubic-bezier(.16,1,.3,1)}
  #titles .t.on{opacity:1;transform:none}
  #titles .big{
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    font-weight:100;font-size:clamp(44px,9.2vw,124px);letter-spacing:.24em;text-indent:.24em;line-height:.96;
  }
  #titles .big b{font-weight:400}
  #titles .sub{margin-top:18px;font-size:clamp(11px,1.2vw,14px);letter-spacing:.42em;text-indent:.42em;color:rgba(231,235,240,.55)}
  #titles .num{
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:200;
    font-size:clamp(30px,5.6vw,68px);letter-spacing:.06em
  }
  #titles .num i{font-style:normal;font-size:.34em;letter-spacing:.2em;color:rgba(231,235,240,.5);margin-left:.55em}
  #titles .cap{margin-top:14px;font-size:12px;letter-spacing:.34em;color:rgba(231,235,240,.5)}

  /* ── 控制条 ── */
  #bar{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);z-index:30;
    display:flex;align-items:stretch;gap:0;
    background:var(--glass);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);
    border:1px solid var(--line);border-radius:2px;
    opacity:0;transition:opacity .7s ease,transform .9s cubic-bezier(.16,1,.3,1);
    max-width:calc(100vw - 32px);overflow:hidden;
  }
  #bar.on{opacity:1;transform:translateX(-50%)}
  #bar .grp{display:flex}
  #bar .sep{width:1px;background:var(--line);margin:8px 0}
  #bar button{
    appearance:none;background:none;border:0;color:rgba(231,235,240,.52);
    font:inherit;font-size:12px;letter-spacing:.16em;text-indent:.16em;
    padding:13px 17px;cursor:pointer;position:relative;white-space:nowrap;
    transition:color .3s ease;
  }
  #bar button:hover{color:rgba(231,235,240,.92)}
  #bar button:focus-visible{outline:1px solid var(--nav);outline-offset:-3px}
  #bar button::after{
    content:"";position:absolute;left:17px;right:17px;bottom:8px;height:1px;
    background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .45s cubic-bezier(.16,1,.3,1);
  }
  #bar button[data-on="1"]{color:var(--paper)}
  #bar button[data-on="1"]::after{transform:scaleX(1)}
  #bar button.act{color:var(--dust)}

  /* ── 提示 ── */
  #hint{
    position:fixed;left:50%;bottom:78px;transform:translateX(-50%);z-index:29;
    font-size:11px;letter-spacing:.26em;color:rgba(231,235,240,.34);
    opacity:0;transition:opacity .8s ease;pointer-events:none;white-space:nowrap
  }

  /* ── 标注层 ── */
  #labels{position:fixed;inset:0;z-index:25;pointer-events:none}
  .lbl{position:absolute;left:0;top:0;will-change:transform,opacity}
  .lbl .dot{
    position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;
    border:1px solid var(--nav);background:rgba(127,216,255,.14);pointer-events:auto;cursor:pointer;
  }
  .lbl .dot::before{
    content:"";position:absolute;inset:2px;border-radius:50%;background:var(--nav);
    transform:scale(.55);transition:transform .35s ease
  }
  .lbl .dot:hover::before{transform:scale(1)}
  .lbl .dot::after{
    content:"";position:absolute;inset:-7px;border-radius:50%;border:1px solid rgba(127,216,255,.5);
    opacity:0;transform:scale(.7);
  }
  .lbl.pulse .dot::after{animation:ring 2.6s ease-out infinite}
  @keyframes ring{0%{opacity:.9;transform:scale(.7)}70%{opacity:0;transform:scale(1.9)}100%{opacity:0}}
  .lbl .ln{position:absolute;left:5px;top:0;height:1px;width:46px;background:linear-gradient(90deg,var(--nav),rgba(127,216,255,.16))}
  .lbl .tx{position:absolute;left:56px;top:-11px;white-space:nowrap}
  .lbl .tx b{display:block;font-weight:500;font-size:12px;letter-spacing:.12em}
  .lbl .tx i{display:block;font-style:normal;font-size:10px;letter-spacing:.18em;color:rgba(127,216,255,.72);margin-top:3px}
  .lbl.flip .ln{left:auto;right:5px;background:linear-gradient(270deg,var(--nav),rgba(127,216,255,.16))}
  .lbl.flip .tx{left:auto;right:56px;text-align:right}

  /* ── 详情卡 ── */
  #card{
    position:fixed;right:26px;top:50%;transform:translateY(-42%) translateX(18px);z-index:31;
    width:244px;padding:18px 19px 19px;
    background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border:1px solid var(--line);border-left:1px solid var(--nav);
    opacity:0;pointer-events:none;transition:opacity .5s ease,transform .7s cubic-bezier(.16,1,.3,1)
  }
  #card.on{opacity:1;transform:translateY(-50%);pointer-events:auto}
  #card h3{font-size:14px;font-weight:500;letter-spacing:.1em;margin-bottom:4px}
  #card .k{font-size:10px;letter-spacing:.22em;color:rgba(127,216,255,.7);margin-bottom:12px}
  #card p{font-size:12px;line-height:1.85;color:rgba(231,235,240,.62)}
  #card .m{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:flex;gap:16px}
  #card .m div span{display:block;font-size:10px;letter-spacing:.16em;color:rgba(231,235,240,.38);margin-bottom:3px}
  #card .m div em{font-style:normal;font-size:14px;font-weight:300;letter-spacing:.04em}
  #card .x{position:absolute;right:10px;top:9px;width:20px;height:20px;border:0;background:none;color:rgba(231,235,240,.45);cursor:pointer;font-size:15px;line-height:1}
  #card .x:hover{color:var(--paper)}

  /* ── 规格条 ── */
  #spec{
    position:fixed;right:26px;bottom:26px;z-index:28;display:flex;gap:26px;
    opacity:0;transition:opacity .8s ease;pointer-events:none
  }
  #spec div span{display:block;font-size:10px;letter-spacing:.2em;color:rgba(231,235,240,.34);margin-bottom:5px}
  #spec div em{font-style:normal;font-weight:200;font-size:19px;letter-spacing:.02em;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
  #spec div em i{font-style:normal;font-size:10px;color:rgba(231,235,240,.4);margin-left:3px;letter-spacing:.1em}

  /* ── 载入 ── */
  #veil{position:fixed;inset:0;z-index:60;background:var(--ink);display:grid;place-items:center;transition:opacity 1.1s ease}
  #veil.off{opacity:0;pointer-events:none}
  #veil .w{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:100;font-size:26px;letter-spacing:.5em;text-indent:.5em}
  #veil .p{margin-top:20px;width:130px;height:1px;background:rgba(231,235,240,.15);position:relative;overflow:hidden}
  #veil .p i{position:absolute;inset:0;background:var(--paper);transform-origin:left;transform:scaleX(0);transition:transform .5s ease}
  #veil .s{margin-top:14px;font-size:10px;letter-spacing:.3em;color:rgba(231,235,240,.34);text-align:center}

  #err{position:fixed;inset:0;z-index:70;display:none;place-items:center;padding:40px;text-align:center;background:var(--ink)}
  #err p{max-width:420px;line-height:2;color:rgba(231,235,240,.6)}

  @media (max-width:820px){
    #brand{left:16px;top:16px}
    #bar{bottom:16px;gap:0}
    #bar button{padding:12px 11px;font-size:11px;letter-spacing:.08em;text-indent:.08em}
    #hint{bottom:66px;font-size:10px}
    #spec{display:none}
    #card{right:14px;left:14px;width:auto;top:auto;bottom:96px;transform:translateY(14px)}
    #card.on{transform:none}
    .lbl .tx b{font-size:11px}
  }
  @media (prefers-reduced-motion:reduce){
    .lbl.pulse .dot::after{animation:none}
  }
</style>
</head>
<body>

<div id="stage"><canvas id="c"></canvas></div>
<div class="lb" id="lbT"></div>
<div class="lb" id="lbB"></div>
<div id="labels"></div>

<header id="brand">
  <div class="w"><b>AEOLIS</b> 01</div>
  <div class="s">火星地表探索概念车</div>
</header>

<div id="titles">
  <div class="t" id="t1"><div class="big"><b>AEOLIS</b> 01</div><div class="sub">火星地表探索概念车</div></div>
  <div class="t" id="t2"><div class="num">2 520<i>mm 轮距</i></div><div class="cap">六轮独立摇臂 · 全地形自适应</div></div>
  <div class="t" id="t3"><div class="num">1 080<i>mm 轮径</i></div><div class="cap">轮边电机 · 可变刚度编织胎面</div></div>
  <div class="t" id="t4"><div class="big" style="font-size:clamp(26px,4.4vw,56px);letter-spacing:.3em;text-indent:.3em">为尘暴而生</div></div>
</div>

<nav id="bar" aria-label="展示控制">
  <div class="grp" id="gEnv">
    <button data-env="studio">影棚</button>
    <button data-env="mars">火星</button>
    <button data-env="blue">蓝图</button>
  </div>
  <div class="sep"></div>
  <div class="grp" id="gView">
    <button data-view="hero">整车</button>
    <button data-view="struct">结构</button>
    <button data-view="chassis">底盘</button>
    <button data-view="cockpit">座舱</button>
  </div>
  <div class="sep"></div>
  <button id="replay" class="act">重播</button>
</nav>

<div id="hint">拖拽环视 · 滚轮缩放</div>

<div id="spec">
  <div><span>长</span><em>5 420<i>mm</i></em></div>
  <div><span>宽</span><em>2 930<i>mm</i></em></div>
  <div><span>高</span><em>2 140<i>mm</i></em></div>
</div>

<aside id="card">
  <button class="x" aria-label="关闭">×</button>
  <h3></h3>
  <div class="k"></div>
  <p></p>
  <div class="m"></div>
</aside>

<div id="veil">
  <div style="text-align:center">
    <div class="w">AEOLIS</div>
    <div class="p"><i></i></div>
    <div class="s">正在构建车体</div>
  </div>
</div>

<div id="err"><p>这台车需要 WebGL 才能开起来。请换用较新的浏览器，或开启硬件加速后重试。</p></div>

<script src="./vendor/three.min.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════
   AEOLIS 01 — 火星地表探索概念车
   全程序化生成：几何体 / 贴图 / 环境光照 / 后期
   ═══════════════════════════════════════════════════════════════ */
(function(){
"use strict";

if(typeof THREE==="undefined"){ document.getElementById("err").style.display="grid"; return; }

/* ── 小工具 ── */
const PI=Math.PI, TAU=PI*2;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const ss=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOut=t=>1-Math.pow(1-t,3);
const easeOutQ=t=>1-Math.pow(1-t,5);
const rnd=(function(){let s=20260914;return function(){s=(s*1664525+1013904223)&0x7fffffff;return s/0x7fffffff;};})();
const rng=(a,b)=>a+(b-a)*rnd();

function hash2(x,y){const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s);}
function vnoise(x,y){
  const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi),b=hash2(xi+1,yi),c=hash2(xi,yi+1),d=hash2(xi+1,yi+1);
  return lerp(lerp(a,b,u),lerp(c,d,u),v);
}
function fbm(x,y,oct){let s=0,a=.5,f=1;for(let i=0;i<(oct||4);i++){s+=a*vnoise(x*f,y*f);f*=2.03;a*=.5;}return s;}

/* ── 渲染器 ── */
const canvas=document.getElementById("c");
let renderer;
try{
  renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:false,powerPreference:"high-performance",stencil:false});
}catch(e){ document.getElementById("err").style.display="grid"; return; }

const DPR=Math.min(window.devicePixelRatio||1,2);
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth,innerHeight,false);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.06;
renderer.autoClear=true;

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x05060a,0.0034);
const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,.12,900);
camera.position.set(9,3,6);

/* ═══ 程序化贴图 ═══ */
function cvs(w,h){const c=document.createElement("canvas");c.width=w;c.height=h;return c;}
function tex(c,rep,enc){
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  if(rep)t.repeat.set(rep[0],rep[1]);
  t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
  if(enc!==false)t.encoding=THREE.sRGBEncoding;
  return t;
}
function gradTex(stops,h){
  const c=cvs(8,h||256),x=c.getContext("2d");
  const g=x.createLinearGradient(0,0,0,c.height);
  stops.forEach(s=>g.addColorStop(s[0],s[1]));
  x.fillStyle=g;x.fillRect(0,0,c.width,c.height);
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;
  t.wrapS=THREE.ClampToEdgeWrapping;t.wrapT=THREE.ClampToEdgeWrapping;
  return t;
}
function radialTex(size,inner,outer,pow){
  const c=cvs(size,size),x=c.getContext("2d");
  const img=x.createImageData(size,size),d=img.data,r=size/2;
  for(let j=0;j<size;j++)for(let i=0;i<size;i++){
    const dx=(i-r)/r,dy=(j-r)/r,dd=Math.sqrt(dx*dx+dy*dy);
    let a=clamp(1-dd,0,1);a=Math.pow(a,pow||2);
    const k=(j*size+i)*4;
    d[k]=255;d[k+1]=255;d[k+2]=255;d[k+3]=a*255;
  }
  x.putImageData(img,0,0);
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t;
}
/* 碳纤维编织 */
function carbonTex(){
  const s=128,c=cvs(s,s),x=c.getContext("2d");
  x.fillStyle="#0b0d10";x.fillRect(0,0,s,s);
  const q=s/4;
  for(let j=0;j<4;j++)for(let i=0;i<4;i++){
    const on=((i+j)%2===0);
    const g=x.createLinearGradient(i*q,j*q,i*q+(on?q:0),j*q+(on?0:q));
    g.addColorStop(0,"#1b2026");g.addColorStop(.5,"#2b3239");g.addColorStop(1,"#12161a");
    x.fillStyle=g;x.fillRect(i*q,j*q,q,q);
  }
  for(let i=0;i<2600;i++){
    x.fillStyle="rgba(255,255,255,"+(rnd()*.05)+")";
    x.fillRect(rnd()*s,rnd()*s,1,1);
  }
  return tex(c,[9,3]);
}
/* 火星地表 */
function regolithTex(){
  const s=512,c=cvs(s,s),x=c.getContext("2d");
  x.fillStyle="#7a4226";x.fillRect(0,0,s,s);
  for(let i=0;i<1500;i++){
    const r=rng(4,42);
    x.fillStyle="rgba("+(120+rnd()*70|0)+","+(58+rnd()*40|0)+","+(30+rnd()*26|0)+","+(rnd()*.30)+")";
    x.beginPath();x.arc(rnd()*s,rnd()*s,r,0,TAU);x.fill();
  }
  for(let i=0;i<220;i++){ /* 碎石 */
    const r=rng(1.5,5.5),px=rnd()*s,py=rnd()*s;
    x.fillStyle="rgba(48,28,18,"+(.28+rnd()*.4)+")";
    x.beginPath();x.arc(px,py,r,0,TAU);x.fill();
    x.fillStyle="rgba(214,152,104,"+(.18+rnd()*.3)+")";
    x.beginPath();x.arc(px-r*.3,py-r*.35,r*.55,0,TAU);x.fill();
  }
  const img=x.getImageData(0,0,s,s),d=img.data;
  for(let i=0;i<d.length;i+=4){const n=(rnd()-.5)*26;d[i]+=n;d[i+1]+=n*.8;d[i+2]+=n*.6;}
  x.putImageData(img,0,0);
  return tex(c,[26,26]);
}
/* 太阳能薄膜 */
function solarTex(){
  const s=256,c=cvs(s,s),x=c.getContext("2d");
  x.fillStyle="#070d16";x.fillRect(0,0,s,s);
  for(let j=0;j<8;j++)for(let i=0;i<8;i++){
    const g=x.createLinearGradient(i*32,j*32,i*32+32,j*32+32);
    g.addColorStop(0,"#0d1b2e");g.addColorStop(.55,"#132a44");g.addColorStop(1,"#0a1524");
    x.fillStyle=g;x.fillRect(i*32+1.5,j*32+1.5,29,29);
    x.strokeStyle="rgba(150,190,230,.14)";x.lineWidth=1;
    x.beginPath();x.moveTo(i*32+16,j*32+2);x.lineTo(i*32+16,j*32+30);x.stroke();
  }
  return tex(c,[5,2]);
}
/* 座舱屏 */
function hudTex(){
  const w=512,h=160,c=cvs(w,h),x=c.getContext("2d");
  x.fillStyle="#000";x.fillRect(0,0,w,h);
  x.strokeStyle="#6fd8ff";x.lineWidth=1.4;
  x.beginPath();x.arc(96,80,52,PI*.72,PI*1.9);x.stroke();
  x.strokeStyle="rgba(111,216,255,.34)";
  x.beginPath();x.arc(96,80,42,PI*.72,PI*1.9);x.stroke();
  for(let i=0;i<9;i++){
    const a=PI*.72+(PI*1.18)*(i/8);
    x.strokeStyle=i>6?"#e08a4a":"rgba(111,216,255,.85)";x.lineWidth=i%2?1:2.4;
    x.beginPath();
    x.moveTo(96+Math.cos(a)*44,80+Math.sin(a)*44);
    x.lineTo(96+Math.cos(a)*(i%2?50:54),80+Math.sin(a)*(i%2?50:54));
    x.stroke();
  }
  x.fillStyle="#eaf6ff";x.font="600 34px Helvetica,Arial";x.fillText("18",74,92);
  x.fillStyle="rgba(111,216,255,.6)";x.font="11px Helvetica,Arial";x.fillText("km/h",122,92);
  x.strokeStyle="rgba(111,216,255,.5)";x.lineWidth=1;
  x.beginPath();x.moveTo(178,26);x.lineTo(178,134);x.stroke();
  x.fillStyle="rgba(234,246,255,.85)";x.font="12px Helvetica,Arial";
  x.fillText("SOL 412   14:06 LMST",198,44);
  x.fillText("SLOPE  9.4°     PITCH  3.1°",198,68);
  x.fillStyle="#e08a4a";x.fillText("DUST  MODERATE",198,92);
  x.fillStyle="rgba(111,216,255,.75)";x.fillText("PACK  81%   RANGE  412 km",198,116);
  for(let i=0;i<30;i++){
    x.fillStyle="rgba(111,216,255,"+(i<24?.75:.2)+")";
    x.fillRect(198+i*10,128,6,3);

function roundRectShape(w,h,r){
  const s=new THREE.Shape(),x=-w/2,y=-h/2;
  r=Math.min(r,w/2,h/2);
  s.moveTo(x+r,y);
  s.lineTo(x+w-r,y); s.quadraticCurveTo(x+w,y,x+w,y+r);
  s.lineTo(x+w,y+h-r); s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  s.lineTo(x+r,y+h); s.quadraticCurveTo(x,y+h,x,y+h-r);
  s.lineTo(x,y+r); s.quadraticCurveTo(x,y,x+r,y);
  return s;
}
function roundedBox(w,h,d,r,seg){
  const g=new THREE.ExtrudeGeometry(roundRectShape(w,h,r),
    {depth:d-0.04,bevelEnabled:true,bevelThickness:.02,bevelSize:.02,bevelSegments:seg||2,curveSegments:seg||4});
  g.translate(0,0,-(d-0.04)/2);
  return g;
}
function strut(a,b,r,mat,seg){
  const dir=new THREE.Vector3().subVectors(b,a),len=dir.length();
  const g=new THREE.CylinderGeometry(r,r,len,seg||10);
  const m=new THREE.Mesh(g,mat);
  m.position.copy(a).add(b).multiplyScalar(.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.normalize());
  return m;
}
function V(x,y,z){return new THREE.Vector3(x,y,z);}

function buildWheel(){

  const prof=[[0.34,-0.200],[0.44,-0.205],[0.50,-0.185],[0.522,-0.120],[0.532,-0.040],
              [0.532,0.040],[0.522,0.120],[0.50,0.185],[0.44,0.205],[0.34,0.200]]

  tire.rotation.x=PI/2; w.add(tire);
  /* 胎面块 */
  const N=30, tg=new THREE.BoxGeometry(0.065,0.088,0.40);
  const tread=new THREE.InstancedMesh(tg,MAT.tread,N);
  const dmy=new THREE.Object3D();
  for(let i=0;i<N;i++){
    const a=i/N*TAU, r=0.523+(i%2?0.010:0.000);
    dmy.position.set(Math.cos(a)*r,Math.sin(a)*r,(i%2?0.05:-0.05));
    dmy.rotation.set(0,0,a);
    dmy.updateMatrix();
    tread.setMatrixAt(i,dmy.matrix);
  }
  tread.instanceMatrix.needsUpdate=true;
  tread.castShadow=true; w.add(tread);
  /* 轮辋 */
  const barrel=new THREE.Mesh(new THREE.CylinderGeometry(.372,.372,.30,44,1,true),MAT.alloyDark);
  barrel.rotation.x=PI/2; barrel.material.side=THREE.DoubleSide; w.add(barrel);

  w.add(lip);

  /* 涡轮叶片 */
  const blades=new THREE.InstancedMesh(new THREE.BoxGeometry(0.30,0.088,0.052),MAT.alloy,9);
  const m1=new THREE.Matrix4(),m2=new THREE.Matrix4(),m3=new THREE.Matrix4(),mm=new THREE.Matrix4();
  m2.makeTranslation(0.215,0,0.055); m3.makeRotationX(0.42);
  for(let i=0;i<9;i++){
    m1.makeRotationZ(i/9*TAU);
    mm.copy(m1).multiply(m2).multiply(m3);
    blades.setMatrixAt(i,mm);
  }
  blades.instanceMatrix.needsUpdate=true;
  blades.castShadow=true; w.add(blades);
  /* 轮毂 */
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(.115,.13,.10,22),MAT.copper);
  hub.rotation.x=PI/2; hub.position.z=.10; w.add(hub);
  const eye=new THREE.Mesh(new THREE.CylinderGeometry(.045,.045,.026,16),MAT.lampC);
  eye.rotation.x=PI/2; eye.position.z=.155; w.add(eye);
  /* 制动盘 + 卡钳 */
  const disc=new THREE.Mesh(new THREE.CylinderGeometry(.30,.30,.026,32),MAT.chassisMetal);
  disc.rotation.x=PI/2; disc.position.z=-.085; w.add(disc);
  const cal=new THREE.Mesh(roundedBox(0.14,0.26,0.10,0.03,2),MAT.copper);
  cal.position.set(-0.02,0.30,-0.085); w.add(cal);
  return w;
}

  tweenUpdate(dt);

  /* 遮幅 */
  const lb=(S.letter*Math.min(innerHeight*0.085,74)).toFixed(1)+"px";
  document.getElementById("lbT").style.height=lb;
  document.getElementById("lbB").style.height=lb;

  /* 车身姿态 */
  G.car.position.y=S.lift;
  G.car.rotation.z=S.roll;
  if(G.ENV.refl&&G.ENV.refl.visible){
    G.ENV.refl.position.y=-S.lift;
    G.ENV.refl.rotation.z=-S.roll;
  }
  /* 壳体透明度 */
  const sh=S.shell;
  SHELL_MATS.forEach(m=>{
    const base=m.userData.baseOpacity;
    const o=base*sh;
    m.opacity=o;
    m.transparent=(o<0.995);
    m.depthWrite=(m===MAT.glass)?false:(o>0.92);
  });
  G.edgeMat.opacity=S.edge;
  G.edgesG.visible=S.edge>0.01;
  if(G.ENV.dust){ G.ENV.dust.material.opacity=S.dustOp;
    G.ENV.dust.visible=S.dustOp>0.01;
    G.ENV.dust.rotation.y=t*0.006;
    G.ENV.dust.position.x=((t*1.4)%24)-12;
  }
  if(G.lidarSpin) G.lidarSpin.rotation.y=t*2.0;

  /* 镜头 */
  if(introOn) introStep(dt);
  else{
    idle+=dt;
    if(idle>6&&camMode==="orbit"&&(view==="hero"||view==="struct")&&!card.classList.contains("on")){
      des.th-=dt*0.045;
    }
  }

  if(camMode==="trans"){
    trans.t+=dt;
    const k=easeIO(clamp(trans.t/trans.d,0,1));
    camera.position.lerpVectors(trans.p0,trans.p1,k);
    THREE.Quaternion.slerp?THREE.Quaternion.slerp(trans.q0,trans.q1,camera.quaternion,k)
                          :camera.quaternion.slerpQuaternions(trans.q0,trans.q1,k);
    camera.fov=lerp(trans.f0,trans.f1,k);
    camera.updateProjectionMatrix();
    if(k>=1){ camMode=trans.next; if(camMode==="cockpit"){ cock.yaw=cock.dyaw=0; cock.pitch=cock.dpitch=-0.02; } }
  }
  else if(camMode==="cockpit"){
    G.car.updateMatrixWorld(true);
    const kk=1-Math.exp(-dt*7);
    cock.yaw+=(cock.dyaw-cock.yaw)*kk;
    cock.pitch+=(cock.dpitch-cock.pitch)*kk;
    const e=eyeWorld();
    e.y+=Math.sin(t*0.9)*0.006;
    camera.position.copy(e);
    const base=new THREE.Euler(0,0,0,"YXZ");
    base.y=-PI/2+cock.yaw+G.car.rotation.y;   /* 车头 +X */
    base.x=cock.pitch;
    base.z=G.car.rotation.z*0.6;
    camera.quaternion.setFromEuler(base);
    camera.fov+= (cock.fov-camera.fov)*kk;
    camera.updateProjectionMatrix();
  }
  else{
    const kk=1-Math.exp(-dt*(introOn?60:4.2));
    cam.th+=(des.th-cam.th)*kk;
    cam.ph+=(des.ph-cam.ph)*kk;
    cam.r +=(des.r -cam.r )*kk;
    cam.tx+=(des.tx-cam.tx)*kk;
    cam.ty+=(des.ty-cam.ty)*kk;
    cam.tz+=(des.tz-cam.tz)*kk;
    cam.fov+=(des.fov-cam.fov)*kk;
    const hand=introOn?0.0022:0.0012;
    const th=cam.th+Math.sin(t*0.47)*hand, ph=clamp(cam.ph+Math.sin(t*0.63+1.2)*hand,0.08,2.06);
    const sp=Math.sin(ph);
    tmpT.set(cam.tx,cam.ty+S.lift*0.55,cam.tz);
    tmpP.set(tmpT.x+cam.r*sp*Math.cos(th), cam.ty+S.lift*0.55+cam.r*Math.cos(ph), tmpT.z+cam.r*sp*Math.sin(th));
    camera.position.copy(tmpP);
    camera.up.set(0,1,0);
    camera.lookAt(tmpT);
    camera.fov=cam.fov;
    camera.updateProjectionMatrix();
  }

  /* 关键光跟随目标 */
  G.ENV.lights.key.target.position.set(0,0.9,0);
  G.ENV.lights.key.target.updateMatrixWorld();

  if(frame%2===0||S.label>0.01) labelsUpdate();
  G.post.render(t);
}

/* ── 尺寸 ── */
function resize(){
  const w=innerWidth,h=innerHeight;
  camera.aspect=w/h; camera.updateProjectionMatrix();
  renderer.setSize(w,h,false);
  G.post.resize(Math.max(2,Math.floor(w*DPR)),Math.max(2,Math.floor(h*DPR)));
}
addEventListener("resize",resize);

/* ── 启动 ── */
setEnv("studio"); setView("hero"); mark();
const veil=document.getElementById("veil");
veil.querySelector(".p i").style.transform="scaleX(1)";
resize();
renderer.compile(scene,camera);
loop();
setTimeout(()=>{
  veil.classList.add("off");
  playIntro();
  setTimeout(()=>veil.style.display="none",1200);
},620);
})();

})();
</script>
