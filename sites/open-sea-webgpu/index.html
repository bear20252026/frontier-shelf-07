<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<title>Open Sea — WebGPU Ocean</title>
<style>
  @font-face {
    font-family: 'Geist';
    src: url('./fonts/geist-sans-400.woff2') format('woff2');
    font-weight: 400; font-display: swap;
  }
  @font-face {
    font-family: 'Geist';
    src: url('./fonts/geist-sans-500.woff2') format('woff2');
    font-weight: 500; font-display: swap;
  }
  @font-face {
    font-family: 'Geist Mono';
    src: url('./fonts/geist-mono-400.woff2') format('woff2');
    font-weight: 400; font-display: swap;
  }

  :root {
    --accent: #8fe9e4;
    --ease: cubic-bezier(0.32, 0.72, 0, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #05070a;
    overflow: hidden;
  }

  body {
    font-family: 'Geist', system-ui, sans-serif;
    color: #fff;
    -webkit-font-smoothing: antialiased;
  }

  canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    display: block;
    touch-action: none;
  }

  /* ---------- overlay UI ---------- */

  #ui {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.1s var(--ease);
  }
  #ui.ready { opacity: 1; }

  .panel-shell {
    position: absolute;
    top: 24px;
    left: 24px;
    pointer-events: auto;
    padding: 6px;
    border-radius: 26px;
    background: rgba(255, 255, 255, 0.045);
    border: 1px solid rgba(255, 255, 255, 0.08);
    transform: translateY(14px);
    opacity: 0;
    transition: transform 1s var(--ease), opacity 1s var(--ease);
  }
  #ui.ready .panel-shell { transform: none; opacity: 1; }

  .panel-core {
    width: 300px;
    padding: 22px 22px 20px;
    border-radius: 20px;
    background: rgba(8, 11, 16, 0.55);
    backdrop-filter: blur(24px) saturate(140%);
    -webkit-backdrop-filter: blur(24px) saturate(140%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07);
  }

  .eyebrow {
    font-family: 'Geist Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.5);
  }

  .panel-core h1 {
    margin-top: 8px;
    font-size: 21px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: rgba(255, 255, 255, 0.95);
  }

  .sub {
    margin-top: 4px;
    font-family: 'Geist Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.05em;
    white-space: nowrap;
    color: rgba(255, 255, 255, 0.38);
  }

  .control { margin-top: 20px; }

  .control label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: 'Geist Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.55);
  }

  .control label span {
    letter-spacing: 0.1em;
    color: var(--accent);
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 18px;
    margin-top: 8px;
    background: transparent;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 3px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.12);
  }
  input[type="range"]::-moz-range-track {
    height: 3px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.12);
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 12px;
    height: 12px;
    margin-top: -4.5px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px rgba(143, 233, 228, 0.55);
    transition: transform 0.4s var(--ease);
  }
  input[type="range"]::-moz-range-thumb {
    width: 12px;
    height: 12px;
    border: none;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px rgba(143, 233, 228, 0.55);
  }
  input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.25); }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 22px;
  }

  .pill {
    font-family: 'Geist Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    padding: 7px 16px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: transparent;
    color: rgba(255, 255, 255, 0.45);
    cursor: pointer;
    transition: all 0.5s var(--ease);
  }
  .pill.active {
    background: rgba(143, 233, 228, 0.13);
    border-color: rgba(143, 233, 228, 0.35);
    color: #d8fffc;
  }
  .pill:active { transform: scale(0.96); }

  .fps {
    font-family: 'Geist Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    color: rgba(255, 255, 255, 0.35);
  }

  .hint {
    position: absolute;
    bottom: 22px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: 'Geist Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.3em;
    color: rgba(255, 255, 255, 0.28);
  }

  .vignette {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    background: radial-gradient(120% 90% at 50% 32%, transparent 55%, rgba(0, 0, 0, 0.45));
  }

  /* ---------- loader / error ---------- */

  #loader {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #05070a;
    transition: opacity 0.9s var(--ease);
  }
  #loader.hidden { opacity: 0; pointer-events: none; }

  .loader-inner { text-align: center; padding: 0 24px; }

  #loader h1 {
    margin: 16px 0 28px;
    font-size: 34px;
    font-weight: 500;
    letter-spacing: 0.42em;
    padding-left: 0.42em;
    color: rgba(255, 255, 255, 0.95);
  }

  .bar {
    width: 168px;
    height: 2px;
    margin: 0 auto 18px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.08);
    overflow: hidden;
  }
  .bar i {
    display: block;
    width: 40%;
    height: 100%;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    animation: slide 1.3s var(--ease) infinite;
  }
  @keyframes slide {
    0% { transform: translateX(-120%); }
    100% { transform: translateX(320%); }
  }

  #loader-msg {
    font-family: 'Geist Mono', monospace;
    font-size: 11px;
    line-height: 1.9;
    letter-spacing: 0.14em;
    color: rgba(255, 255, 255, 0.42);
  }
  #loader.error .bar { display: none; }
  #loader.error h1 {
    font-size: 20px;
    letter-spacing: 0.12em;
    padding-left: 0;
    color: #ff9b86;
  }

  @media (max-width: 768px) {
    .panel-shell { top: 14px; left: 14px; right: 14px; }
    .panel-core { width: 100%; }
    .hint { display: none; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.webgpu.js",
    "three/webgpu": "./vendor/three/three.webgpu.js",
    "three/tsl": "./vendor/three/three.tsl.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
</head>
<body>

<div id="ui">
  <section class="panel-shell">
    <div class="panel-core">
      <header>
        <div class="eyebrow">Realtime Ocean</div>
        <h1>OPEN SEA</h1>
        <p class="sub">Gerstner swell · FBM micro-surface · spectral sky</p>
      </header>

      <div class="control">
        <label>Sea State <span id="sea-val">45</span></label>
        <input id="sea" type="range" min="0" max="100" value="45" aria-label="Sea state">
      </div>

      <div class="control">
        <label>Time of Day <span id="tod-val">AFTERNOON</span></label>
        <input id="tod" type="range" min="0" max="100" value="55" aria-label="Time of day">
      </div>

      <div class="row">
        <button id="drift" class="pill active" type="button">DRIFT</button>
        <span id="fps" class="fps">– FPS</span>
      </div>
    </div>
  </section>

  <div class="hint">DRAG TO ORBIT — SCROLL TO ZOOM</div>
</div>

<div class="vignette"></div>

<div id="loader">
  <div class="loader-inner">
    <div class="eyebrow">WebGPU · Three.js · TSL</div>
    <h1>OPEN SEA</h1>
    <div class="bar"><i></i></div>
    <p id="loader-msg">INITIALIZING RENDERER…</p>
  </div>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
